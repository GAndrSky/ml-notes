<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Повторение — ML Notes</title>
  <meta name="description" content="Интервальное повторение вопросов для самопроверки из всех уроков ML Notes." />
  <link rel="icon" type="image/png" href="favicon.png" />
  <link rel="stylesheet" href="shared-theme.css" />
  <link rel="stylesheet" href="review.css" />
</head>
<body class="ml-review-theme">
  <main class="rv-wrap">
    <header class="rv-head">
      <a class="rv-back" href="index.html">← К курсу</a>
      <h1>Повторение</h1>
      <p class="rv-lead">Вопросы для самопроверки из всех уроков. Сначала ответь сам, потом открой ответ и честно оцени, вспомнил ли. Карточки, которые ты помнишь, будут возвращаться всё реже; забытые — чаще.</p>
    </header>

    <section class="rv-panel" aria-label="Настройки">
      <div class="rv-filters">
        <label class="rv-field">
          <span>Блок</span>
          <select id="rvSection"><option value="all">Все блоки</option></select>
        </label>
        <label class="rv-check"><input type="checkbox" id="rvVisited" /> только пройденные уроки</label>
        <label class="rv-check"><input type="checkbox" id="rvWeak" /> сначала темы с низкой самооценкой</label>
      </div>
      <div class="rv-stats" id="rvStats" aria-live="polite"></div>
    </section>

    <section class="rv-card" id="rvCard" aria-live="polite">
      <div class="rv-card__meta"><a id="rvLesson" href="#"></a><span id="rvBox"></span></div>
      <h2 class="rv-card__q" id="rvQuestion"></h2>
      <div class="rv-card__a" id="rvAnswer" hidden></div>
      <div class="rv-actions" id="rvReveal">
        <button type="button" class="rv-btn rv-btn--primary" id="rvShow">Показать ответ <kbd>Пробел</kbd></button>
      </div>
      <div class="rv-actions" id="rvGrade" hidden>
        <button type="button" class="rv-btn rv-btn--again" data-grade="0">Не вспомнил <kbd>1</kbd></button>
        <button type="button" class="rv-btn rv-btn--hard" data-grade="1">С трудом <kbd>2</kbd></button>
        <button type="button" class="rv-btn rv-btn--good" data-grade="2">Вспомнил <kbd>3</kbd></button>
      </div>
    </section>

    <section class="rv-done" id="rvDone" hidden>
      <h2>На сегодня всё</h2>
      <p id="rvDoneText"></p>
      <button type="button" class="rv-btn" id="rvExtra">Повторить ещё 10 случайных карточек</button>
    </section>

    <footer class="rv-foot">
      <p>Прогресс хранится в этом браузере. <button type="button" class="rv-link" id="rvReset">Сбросить прогресс повторения</button></p>
    </footer>
  </main>
  <script src="course-manifest.js"></script>
  <script src="shared-review-data.js"></script>
  <script src="shared-review.js"></script>
</body>
</html>
